name: global-exchange-production

x-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME es obligatorio}
      POSTGRES_USER: ${DB_USER:?DB_USER es obligatorio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *production-logging
    networks: [global_exchange_prod]

  mailpit:
    image: axllent/mailpit
    profiles: [demo]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    logging: *production-logging
    networks: [global_exchange_prod]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    command: start --import-realm --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN es obligatorio}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${DB_USER:?DB_USER es obligatorio}
      KC_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL es obligatorio}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    expose:
      - "8080"
    volumes:
      - ./keycloak/global-exchange-realm.json:/opt/keycloak/data/import/global-exchange-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *production-logging
    networks: [global_exchange_prod]

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - "sed 's/\\r$//' /config/configure-admin-client.sh > /tmp/configure-admin-client.sh && exec /bin/sh /tmp/configure-admin-client.sh"
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-global-exchange}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN es obligatorio}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-global-exchange-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET es obligatorio}
    volumes:
      - ./docker/keycloak/configure-admin-client.sh:/config/configure-admin-client.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    logging: *production-logging
    networks: [global_exchange_prod]

  keycloak-web-config:
    image: python:3.13-slim
    restart: "no"
    command: ["python", "/config/configure-web-client.py"]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-global-exchange}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN es obligatorio}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD es obligatorio}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-global-exchange-web}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?BACKEND_PUBLIC_URL es obligatorio}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:?OIDC_CALLBACK_URL es obligatorio}
    volumes:
      - ./docker/keycloak/configure-web-client.py:/config/configure-web-client.py:ro
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    logging: *production-logging
    networks: [global_exchange_prod]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-2}
      - --timeout=${GUNICORN_TIMEOUT:-60}
      - --access-logfile=-
      - --error-logfile=-
    environment:
      HOME: /tmp
      DJANGO_ENVIRONMENT: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY es obligatorio}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS es obligatorio}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_BEHIND_HTTPS_PROXY: ${DJANGO_BEHIND_HTTPS_PROXY:-false}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_COLLECTSTATIC: "true"
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL es obligatorio}
      DB_NAME: ${DB_NAME:?DB_NAME es obligatorio}
      DB_USER: ${DB_USER:?DB_USER es obligatorio}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      DB_HOST: postgres
      DB_PORT: 5432
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL es obligatorio}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-global-exchange}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-global-exchange-web}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-global-exchange-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET es obligatorio}
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:?KEYCLOAK_EXPECTED_ISSUER es obligatorio}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?BACKEND_PUBLIC_URL es obligatorio}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:?OIDC_CALLBACK_URL es obligatorio}
      OIDC_FLOW_MAX_AGE_SECONDS: ${OIDC_FLOW_MAX_AGE_SECONDS:-600}
      OIDC_LOGIN_SUCCESS_URL: ${OIDC_LOGIN_SUCCESS_URL:-}
      OIDC_REGISTRATION_SUCCESS_URL: ${OIDC_REGISTRATION_SUCCESS_URL:-}
      OIDC_ERROR_URL: ${OIDC_ERROR_URL:-}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      keycloak-web-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *production-logging
    networks: [global_exchange_prod]

  nginx:
    build:
      context: ./docker/nginx
    restart: unless-stopped
    environment:
      NGINX_TLS_ENABLED: ${NGINX_TLS_ENABLED:-false}
      NGINX_APP_HOST: ${NGINX_APP_HOST:?NGINX_APP_HOST es obligatorio}
      NGINX_KEYCLOAK_HOST: ${NGINX_KEYCLOAK_HOST:?NGINX_KEYCLOAK_HOST es obligatorio}
      NGINX_PUBLIC_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
      NGINX_PUBLIC_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
      NGINX_KEYCLOAK_PUBLIC_PORT: ${NGINX_KEYCLOAK_PORT:-8080}
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
      - "${NGINX_HTTPS_PORT:-443}:8443"
      - "${NGINX_KEYCLOAK_PORT:-8080}:8081"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health | grep -q '^ok$'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *production-logging
    networks: [global_exchange_prod]

volumes:
  postgres_prod_data:

networks:
  global_exchange_prod:
    driver: bridge
