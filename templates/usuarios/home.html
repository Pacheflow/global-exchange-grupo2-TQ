{% extends 'usuarios/base.html' %}
{% block title %}Global Exchange · Cambios en Paraguay{% endblock %}
{% block content %}
<div
  id="global-landing"
  data-react-component="Landing"
  data-react-prop-authenticated="{% if request.session.kc_user %}true{% else %}false{% endif %}"
  data-react-prop-primary-action-url="{% if request.session.kc_user %}{% url 'usuarios:dashboard' %}{% else %}{% url 'usuarios:registro' %}{% endif %}"
  data-react-prop-primary-action-label="{% if request.session.kc_user %}Ir al dashboard{% else %}Crear una cuenta{% endif %}"
  data-react-prop-login-url="{% url 'usuarios:login' %}"
  data-react-prop-register-url="{% url 'usuarios:registro' %}"
></div>
<noscript>
  <section class="public-section">
    <h1>Global Exchange</h1>
    <p>Para utilizar la interfaz pública es necesario habilitar JavaScript.</p>
    <a class="button button-public-primary" href="{% url 'usuarios:login' %}">Iniciar sesión</a>
  </section>
</noscript>
{% endblock %}
{% block public_footer %}{% endblock %}
