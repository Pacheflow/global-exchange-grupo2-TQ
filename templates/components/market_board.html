<article class="ge-market-board" data-market-board aria-label="Panel Global Market con tasas reales">
  <header class="ge-market-board__header">
    <div>
      <span class="ge-market-board__eyebrow">Global Market</span>
      <small>GE · Market 001</small>
    </div>
    <div class="ge-market-board__status">
      <span><i aria-hidden="true"></i> <span data-market-status>Consultando</span></span>
      <small>Asunción · Paraguay</small>
    </div>
  </header>

  <div class="ge-market-board__primary ge-market-stage" data-market-stage>
    <div class="ge-market-board__pair">
      <span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
        <span data-market-pair>USD / PYG</span>
      </span>
      <strong data-market-primary>—</strong>
    </div>
    <small class="ge-market-board__subtitle" data-market-subtitle>Dólar estadounidense / Guaraní paraguayo</small>
    <div class="ge-market-board__metrics">
      <div><small>Referencia</small><strong data-market-buy>—</strong></div>
      <div><small>Fuente</small><strong data-market-sell>—</strong></div>
      <div><small>Estado</small><strong data-market-change>—</strong></div>
    </div>
  </div>

  <div class="ge-market-board__chart ge-market-stage" data-market-stage>
    <svg class="ge-sparkline" viewBox="0 0 560 82" preserveAspectRatio="none" role="img" aria-label="Histórico disponible próximamente" data-market-chart></svg>
    <div><span>Histórico · Próximamente</span><span data-market-chart-pair>USD / PYG</span></div>
  </div>

  <div class="ge-market-board__market ge-market-stage" data-market-stage>
    <span class="ge-market-board__market-title">Mercado</span>
    <div class="ge-market-board__market-grid">
      <button type="button" data-market-code="EUR" aria-label="Mostrar cotización EUR"><small>EUR</small><strong data-market-quote>—</strong><span data-market-option-state>Consultando</span></button>
      <button type="button" data-market-code="BRL" aria-label="Mostrar cotización BRL"><small>BRL</small><strong data-market-quote>—</strong><span data-market-option-state>Consultando</span></button>
      <button type="button" data-market-code="ARS" aria-label="Mostrar cotización ARS"><small>ARS</small><strong data-market-quote>—</strong><span data-market-option-state>Consultando</span></button>
    </div>
  </div>

  <footer class="ge-market-board__footer ge-market-stage" data-market-stage>
    <span>Live Exchange Board · Ref 001</span>
    <span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-market-updated>Actualización no disponible</span>
    </span>
  </footer>
</article>
