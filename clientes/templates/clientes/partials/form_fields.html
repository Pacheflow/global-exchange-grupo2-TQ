{% if form.non_field_errors %}<div class="ge-field-errors"><ul>{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
{% for field in form %}<div class="ge-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>{% endfor %}
